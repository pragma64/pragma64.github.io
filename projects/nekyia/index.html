    <script>
      // Firefox leaves any AudioContext cpal (bevy_audio's wasm backend) creates
      // permanently `suspended` — cpal calls resume() exactly once, from inside
      // Bevy's ECS loop rather than a raw gesture handler, and Firefox is strict
      // enough about that timing to never honor it (Chrome is lenient and just
      // works). cpal doesn't expose the context it creates, so we can't reach in
      // and resume the real one directly — instead we wrap the AudioContext
      // constructor so every context ever created on this page (including
      // cpal's) gets resume() retried on the next real user gesture. Standard
      // workaround for this class of bug, per
      // developer.chrome.com/blog/web-audio-autoplay.
      (() => {
        const Native = window.AudioContext || window.webkitAudioContext;
        if (!Native) return;
        const contexts = [];
        window.AudioContext = window.webkitAudioContext = function (...args) {
          const ctx = new Native(...args);
          contexts.push(ctx);
          return ctx;
        };
        window.AudioContext.prototype = Native.prototype;
        const resumeAll = () => contexts.forEach((c) => c.state === "suspended" && c.resume());
        ["click", "keydown", "touchend", "pointerdown"].forEach((evt) =>
          document.addEventListener(evt, resumeAll)
        );
      })();
    </script>
